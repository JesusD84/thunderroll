name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run unit/integration tests
        run: npm test

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Los tres navegadores que define playwright.config.ts. --with-deps
      # instala también las librerías del sistema que necesitan.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Los e2e no necesitan backend ni base de datos: playwright.config.ts
      # levanta una API de mentira (e2e/mock-backend.mjs) y la app real
      # compilada en modo producción.
      #
      # El navegador ya no habla con la API directamente (todo pasa por el
      # proxy del servidor), así que no hay CORS ni preflight: un solo
      # origen y los mocks mandan.
      #
      # NEXTAUTH_SECRET tiene que ser el mismo en el proceso de los tests
      # (que firma la cookie de sesión) y en el servidor (que la abre):
      # playwright.config.ts lo define para los dos.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Trazas y capturas de los tests que fallaron: para depurar sin
      # tener que reproducirlos en local.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
