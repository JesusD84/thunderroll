name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test-password
          SMTP_FROM: test@example.com
          FRONTEND_URL: http://localhost:3000

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ruff
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          # Versión fijada: una actualización de ruff puede añadir reglas nuevas
          # y romper el PR de todos los demás. Se actualiza a propósito.
          pip install ruff==0.17.3

      # Gate bloqueante: ruff está en cero hallazgos, así que cualquier
      # regresión de estilo o bug menor que introduzca un PR se ve aquí.
      # Las reglas viven en backend/pyproject.toml ([tool.ruff]).
      - name: Run ruff
        run: ruff check app/ tests/

      # El formato también es parte del gate: --check no modifica nada,
      # solo avisa si un archivo quedó fuera del formato canónico.
      - name: Check ruff format
        run: ruff format --check app/ tests/
