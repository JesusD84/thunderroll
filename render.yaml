services:
  - type: web
    name: thunderroll-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      # Connection string de Neon. Se gestiona en el dashboard de Render
      # (Environment), no en el blueprint, para no exponer credenciales en git.
      # Debe incluir ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # La clave de firma de los JWT se gestiona en el dashboard (Environment),
      # nunca en el blueprint: es un secreto que hay que poder rotar a mano.
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      # Vida del token de acceso, en minutos. Tiene que coincidir con el
      # default del código (60): el blueprint pisa lo que haya en el
      # dashboard, así que dejarlo en 30 hacía que producción corriera con
      # tokens más cortos de lo previsto.
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Vida del token de refresco, en días: es lo que permite renovar la
      # sesión sin volver a pedir la contraseña.
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Entorno: solo "development" agrega los orígenes de localhost a la
      # lista de CORS. En producción valen FRONTEND_URL y ALLOWED_ORIGINS.
      - key: ENV
        value: production
      - key: FRONTEND_URL
        value: https://thunderroll.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: noreply@thunderoll.com
      # La contraseña SMTP se gestiona en el dashboard (Environment), nunca en
      # el blueprint: declararla aquí la sobreescribiría con un literal en
      # cada deploy.
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@thunderoll.com
      # Contraseña inicial del admin bootstrap (solo aplica a una base vacía).
      # Si no se define, el seed genera una aleatoria y la imprime una vez.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
