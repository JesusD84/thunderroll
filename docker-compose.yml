
services:
  postgres:
    image: postgres:15
    container_name: thunderoll_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thunderoll}
      POSTGRES_USER: ${POSTGRES_USER:-thunderoll}
      # La contraseña vive en el .env local (nunca en git). El default es un
      # placeholder: cámbiala por una tuya.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thunderoll -d thunderoll"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: thunderoll_backend
    environment:
      # Se arma con las mismas variables que usa el servicio postgres de más
      # arriba, así que cambiar la contraseña en el .env basta: no puede
      # quedar desincronizada con la que se inicializó el volumen.
      DATABASE_URL: postgresql://${POSTGRES_USER:-thunderoll}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-thunderoll}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # "development" es lo que habilita los orígenes de localhost en CORS.
      ENV: ${ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Archivos subidos: se guardan con nombre del servidor, en un directorio
      # que ninguna ruta de la API sirve (ver app/services/upload_service.py).
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/app/var/imports}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      MAX_IMPORT_ROWS_PER_SHEET: ${MAX_IMPORT_ROWS_PER_SHEET:-20000}
      MAX_IMPORT_SHEETS: ${MAX_IMPORT_SHEETS:-50}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_imports:/app/var/imports
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thunderoll_frontend
    environment:
      BACKEND_URL: ${BACKEND_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_imports:

networks:
  default:
    name: thunderoll_network
